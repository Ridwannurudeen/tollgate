location = /aperture {
    proxy_pass http://127.0.0.1:3036;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /aperture/ {
    proxy_pass http://127.0.0.1:3036;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /immich/api/ {
    proxy_pass http://127.0.0.1:2283/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
}

# Aperture download enforcement: shared-link archive downloads must hold a
# license receipt (auth_request -> Aperture license-check). Owner-session
# downloads (no ?key=) pass through; unpaid shared-link downloads get 402.
location = /immich/api/download/archive {
    auth_request /_aperture/license-check;
    error_page 401 403 = @aperture_payment_required;
    proxy_pass http://127.0.0.1:2283/api/download/archive$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Immich-Share-Key "";
    proxy_set_header X-Immich-Share-Slug "";
    proxy_buffering off;
}

location = /_aperture/license-check {
    internal;
    proxy_pass http://127.0.0.1:3036/aperture/api/license-check;
    proxy_http_version 1.1;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-Immich-Share-Key $http_x_immich_share_key;
    proxy_set_header X-Original-Immich-Share-Slug $http_x_immich_share_slug;
}

location @aperture_payment_required {
    default_type application/json;
    return 402 '{"error":"payment required","pay":"/aperture/api/license-download"}';
}
