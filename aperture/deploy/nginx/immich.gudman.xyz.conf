server {
  listen 80;
  listen [::]:80;
  server_name immich.gudman.xyz;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name immich.gudman.xyz;

  client_max_body_size 500M;

  ssl_certificate /etc/letsencrypt/live/immich.gudman.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/immich.gudman.xyz/privkey.pem;

  location = /api/download/archive {
    auth_request /_aperture/license-check;
    error_page 401 403 = @aperture_payment_required;
    proxy_pass http://127.0.0.1:2283/api/download/archive$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Immich-Share-Key "";
    proxy_set_header X-Immich-Share-Slug "";
    proxy_buffering off;
  }

  location = /_aperture/license-check {
    internal;
    proxy_pass http://127.0.0.1:3036/aperture/api/license-check;
    proxy_http_version 1.1;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-Immich-Share-Key $http_x_immich_share_key;
    proxy_set_header X-Original-Immich-Share-Slug $http_x_immich_share_slug;
  }

  location @aperture_payment_required {
    default_type application/json;
    return 402 '{"error":"payment required","pay":"https://tollgate.gudman.xyz/aperture/api/license-download"}';
  }

  location / {
    proxy_pass http://127.0.0.1:2283;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
