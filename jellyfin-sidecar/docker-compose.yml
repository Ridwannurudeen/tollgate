services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    ports:
      - "8096:8096"
    volumes:
      - ./demo/jellyfin/config:/config
      - ./demo/jellyfin/cache:/cache
      - ./demo/media:/media:ro

  tollgate-jellyfin-sidecar:
    build: .
    environment:
      JELLYFIN_SIDECAR_PORT: "4317"
      JELLYFIN_REGISTRY_PATH: /app/data/registry.json
      JELLYFIN_OPERATORS_PATH: /app/data/operators.json
      JELLYFIN_LEDGER_PATH: /app/data/ledger.json
      JELLYFIN_SESSIONS_PATH: /app/data/sessions.json
      JELLYFIN_PUBLIC_WEBHOOK_URL: http://127.0.0.1:4317/webhooks/jellyfin
      JELLYFIN_REGISTRATION_SECRET: local-demo-registration-capability
      JELLYFIN_USDC_ATOMIC_PER_MINUTE: "2500"
      JELLYFIN_FEE_ROUTER_MODE: dry-run
      JELLYFIN_FEE_ROUTER_PRIVATE_KEY: ""
    ports:
      - "4317:4317"
    volumes:
      - ./data:/app/data
